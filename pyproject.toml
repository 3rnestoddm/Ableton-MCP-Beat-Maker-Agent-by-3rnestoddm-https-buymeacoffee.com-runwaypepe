[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ableton-mcp-bridge"
version = "0.1.0"
description = "Minimal MCP stdio bridge for Ableton Live status and path discovery."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
assets = ["Pillow>=10"]

[project.scripts]
ableton-mcp-bridge = "integrations.ableton.ableton_mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["integrations*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

